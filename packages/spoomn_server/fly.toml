app = 'spoomn-server'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'
  build_target = '/app'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 500
    soft_limit = 400

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
