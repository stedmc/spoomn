name: spoomn_client
description: Flutter client for Spoomn.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  supabase_flutter: ^2.5.6
  go_router: ^17.5.0
  app_links: ^7.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  spoomn_core:
    path: ../spoomn_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
