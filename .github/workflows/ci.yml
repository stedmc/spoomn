name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
        working-directory: packages/spoomn_core
      - name: Generate code
        run: dart run build_runner build
        working-directory: packages/spoomn_core
      - name: Analyze
        run: dart analyze --fatal-infos
        working-directory: packages/spoomn_core
      - name: Test
        run: if find test -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then dart test; else echo "No tests found, skipping."; fi
        working-directory: packages/spoomn_core

  server:
    name: Server (analyze + test)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install core deps
        run: dart pub get
        working-directory: packages/spoomn_core
      - name: Generate core
        run: dart run build_runner build
        working-directory: packages/spoomn_core
      - name: Install server deps
        run: dart pub get
        working-directory: packages/spoomn_server
      - name: Analyze
        run: dart analyze --fatal-infos
        working-directory: packages/spoomn_server
      - name: Test
        run: if find test -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then dart test; else echo "No tests found, skipping."; fi
        working-directory: packages/spoomn_server

  client:
    name: Client (analyze + test)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install core deps
        run: dart pub get
        working-directory: packages/spoomn_core
      - name: Generate core
        run: dart run build_runner build
        working-directory: packages/spoomn_core
      - name: Install client deps
        run: flutter pub get
        working-directory: packages/spoomn_client
      - name: Generate client
        run: dart run build_runner build
        working-directory: packages/spoomn_client
      - name: Analyze
        run: flutter analyze --fatal-infos
        working-directory: packages/spoomn_client
      - name: Test
        run: if find test -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then flutter test; else echo "No tests found, skipping."; fi
        working-directory: packages/spoomn_client

  deploy-server:
    name: Deploy server to Fly.io
    runs-on: ubuntu-latest
    needs: [core, server]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-client:
    name: Deploy client to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [core, client]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install core deps
        run: dart pub get
        working-directory: packages/spoomn_core
      - name: Generate core
        run: dart run build_runner build
        working-directory: packages/spoomn_core
      - name: Install client deps
        run: flutter pub get
        working-directory: packages/spoomn_client
      - name: Generate client
        run: dart run build_runner build
        working-directory: packages/spoomn_client
      - name: Build web
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        working-directory: packages/spoomn_client
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/spoomn_client/build/web --project-name=spoomn --branch=main
